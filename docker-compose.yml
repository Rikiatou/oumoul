version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: oumoul-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: oumoulRootSecure123!
      MYSQL_DATABASE: oumoul
      MYSQL_USER: oumoul
      MYSQL_PASSWORD: oumoulpassword
    ports:
      - "3309:3306"
    command: ["--default-authentication-plugin=mysql_native_password"]
